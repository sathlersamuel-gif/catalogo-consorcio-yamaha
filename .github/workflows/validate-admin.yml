name: Validate Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check admin scripts syntax
        run: |
          node --check admin.js
          node --check admin-restored.js
          node --check admin-legacy-features.js
          node --check admin-analytics.js
      - name: Check client tracking syntax
        run: |
          node --check client.js
          node --check client-analytics.js
      - name: Run existing tests
        run: npm test
