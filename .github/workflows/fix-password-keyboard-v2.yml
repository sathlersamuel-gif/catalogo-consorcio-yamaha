name: Corrigir teclado da senha administrativa v2

on:
  push:
    branches:
      - fix-password-keyboard-v2-2026-08-12
    paths:
      - '.github/workflows/fix-password-keyboard-v2.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-password-keyboard-v2-2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remover inputmode dos campos de senha
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.js')
          s = p.read_text(encoding='utf-8')
          old_login = 'autocomplete="current-password" inputmode="text"'
          new_login = 'autocomplete="current-password"'
          old_new = 'autocomplete="new-password" inputmode="text"'
          new_new = 'autocomplete="new-password"'
          if s.count(old_login) != 1:
              raise SystemExit(f'Campo login esperado: {s.count(old_login)} ocorrência(s)')
          if s.count(old_new) != 1:
              raise SystemExit(f'Campo nova senha esperado: {s.count(old_new)} ocorrência(s)')
          s = s.replace(old_login, new_login, 1)
          s = s.replace(old_new, new_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar especificamente os campos de senha
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('admin.js').read_text(encoding='utf-8')
          inputs = re.findall(r'<input[^>]+type="password"[^>]*>', s)
          if len(inputs) != 2:
              raise SystemExit(f'Esperados 2 campos password; encontrados {len(inputs)}')
          for field in inputs:
              if 'inputmode=' in field:
                  raise SystemExit('Ainda existe inputmode em campo de senha: ' + field)
              if 'minlength="6"' not in field:
                  raise SystemExit('minlength foi alterado indevidamente')
          if 'autocomplete="current-password"' not in inputs[0]:
              raise SystemExit('Campo de login perdeu autocomplete correto')
          if 'autocomplete="new-password"' not in inputs[1]:
              raise SystemExit('Campo de nova senha perdeu autocomplete correto')
          print('OK: 2 campos password, sem inputmode, aceitando senha alfanumerica.')
          PY
      - name: Validar sistema existente
        run: |
          npm ci
          npm run check
      - name: Salvar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          git commit -m "Remove inputmode dos campos de senha administrativa"
          git push origin HEAD:fix-password-keyboard-v2-2026-08-12
