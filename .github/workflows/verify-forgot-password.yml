name: Verificar recuperação de senha administrativa

on:
  push:
    branches:
      - forgot-password-2026-08-12

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgot-password-2026-08-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar sistema existente e novo módulo
        run: |
          npm run check
          node --check forgot-password.js
      - name: Testar interface de recuperação
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const { JSDOM } = require('jsdom');
          const script = fs.readFileSync('forgot-password.js', 'utf8');
          const config = {
            supabaseUrl: 'https://example.supabase.co',
            supabasePublishableKey: 'sb_publishable_test_key_12345678901234567890',
            adminEmail: 'admin@example.com',
          };
          const okResponse = () => ({
            ok: true,
            headers: { get: () => 'application/json' },
            json: async () => ({}),
            text: async () => '',
          });

          (async () => {
            const dom = new JSDOM('<!doctype html><div id="adminRoot"><form id="loginForm"></form></div>', {
              url: 'https://sathlersamuel-gif.github.io/catalogo-consorcio-yamaha/admin.html',
              runScripts: 'outside-only',
            });
            dom.window.CATALOG_CONFIG = config;
            const calls = [];
            dom.window.fetch = async (...args) => { calls.push(args); return okResponse(); };
            dom.window.eval(script);
            const forgot = dom.window.document.querySelector('[data-forgot-password]');
            assert(forgot, 'Botão Esqueci minha senha não foi inserido');
            assert.strictEqual(forgot.type, 'button');
            forgot.click();
            await new Promise((resolve) => setTimeout(resolve, 20));
            assert(calls.length === 1, 'Solicitação de recuperação não foi enviada');
            assert(String(calls[0][0]).includes('/auth/v1/recover?redirect_to='));
            assert(String(calls[0][1].body).includes('admin@example.com'));

            const recoveryDom = new JSDOM('<!doctype html><div id="adminRoot"></div>', {
              url: 'https://sathlersamuel-gif.github.io/catalogo-consorcio-yamaha/admin.html#access_token=test-token&type=recovery',
              runScripts: 'outside-only',
            });
            recoveryDom.window.CATALOG_CONFIG = config;
            const recoveryCalls = [];
            recoveryDom.window.fetch = async (...args) => { recoveryCalls.push(args); return okResponse(); };
            recoveryDom.window.eval(script);
            const form = recoveryDom.window.document.getElementById('recoveryPasswordForm');
            assert(form, 'Formulário de nova senha não apareceu');
            const password = form.querySelector('input[name="password"]');
            const confirmation = form.querySelector('input[name="confirm_password"]');
            assert(password && confirmation, 'Campos de senha ausentes');
            assert(!password.hasAttribute('inputmode'), 'Campo de nova senha restringe teclado');
            assert(!confirmation.hasAttribute('inputmode'), 'Confirmação restringe teclado');
            password.value = 'SenhaABC123';
            confirmation.value = 'SenhaABC123';
            form.dispatchEvent(new recoveryDom.window.Event('submit', { bubbles: true, cancelable: true }));
            await new Promise((resolve) => setTimeout(resolve, 30));
            assert(recoveryCalls.length === 1, 'Nova senha não foi enviada ao Auth');
            assert(String(recoveryCalls[0][0]).endsWith('/auth/v1/user'));
            assert.strictEqual(recoveryCalls[0][1].headers.Authorization, 'Bearer test-token');
            assert(String(recoveryCalls[0][1].body).includes('SenhaABC123'));
            console.log('Interface e fluxo local de recuperação: OK');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Validar endpoint e URL de retorno no Supabase
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('config.js', 'utf8');
          const base = text.match(/supabaseUrl:\s*['\"]([^'\"]+)/)?.[1]?.replace(/\/$/, '');
          const key = text.match(/supabasePublishableKey:\s*['\"]([^'\"]+)/)?.[1];
          if (!base || !key) throw new Error('Configuração Supabase não encontrada');
          const redirectTo = 'https://sathlersamuel-gif.github.io/catalogo-consorcio-yamaha/admin.html';
          const email = `recovery-probe-${Date.now()}@example.invalid`;
          fetch(`${base}/auth/v1/recover?redirect_to=${encodeURIComponent(redirectTo)}`, {
            method: 'POST',
            headers: { apikey: key, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          }).then(async (response) => {
            const body = await response.text();
            console.log(`Supabase recovery HTTP ${response.status}`);
            if (!response.ok) {
              console.error(body);
              process.exit(1);
            }
            console.log('Endpoint de recuperação e redirect do admin: OK');
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
