name: Corrigir teclado da senha administrativa

on:
  push:
    branches:
      - fix-admin-password-keyboard-2026-08-12
    paths:
      - '.github/workflows/fix-password-keyboard.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-admin-password-keyboard-2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Corrigir apenas os dois campos de senha
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.js')
          s = p.read_text(encoding='utf-8')
          old_login = 'autocomplete="current-password" inputmode="numeric"'
          new_login = 'autocomplete="current-password" inputmode="text"'
          old_new = 'autocomplete="new-password" inputmode="numeric"'
          new_new = 'autocomplete="new-password" inputmode="text"'
          if old_login not in s:
              raise SystemExit('Campo de login esperado não encontrado')
          if old_new not in s:
              raise SystemExit('Campo de nova senha esperado não encontrado')
          s = s.replace(old_login, new_login, 1)
          s = s.replace(old_new, new_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar sistema
        shell: bash
        run: |
          grep -q 'autocomplete="current-password" inputmode="text"' admin.js
          grep -q 'autocomplete="new-password" inputmode="text"' admin.js
          ! grep -q 'type="password"[^>]*inputmode="numeric"' admin.js
          npm ci
          npm run check
      - name: Salvar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js
          git commit -m "Corrige teclado alfanumerico nos campos de senha"
          git push origin HEAD:fix-admin-password-keyboard-2026-08-12
